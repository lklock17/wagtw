name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android-agent/**'
      - '.github/workflows/build-apk.yml'
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build WAGTW Agent APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android Debug APK
        run: |
          cd apps/android-agent
          gradle assembleDebug --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAGTW-Agent-Debug-APK
          path: apps/android-agent/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: android-agent-latest
          name: WAGTW Android Agent (APK Release)
          body: |
            ### 📱 WAGTW Android Agent
            Instal file APK di bawah ini ke HP Android Anda untuk menghubungkannya ke server WAGTW.
            
            **Cara Pasang:**
            1. Download file `app-debug.apk`.
            2. Buka dan instal di ponsel Android Anda.
            3. Buka aplikasi, masukkan URL server WAGTW, beri izin Notifikasi & Aksesibilitas.
            4. Klik **Mulai Layanan Agen**.
          files: apps/android-agent/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
